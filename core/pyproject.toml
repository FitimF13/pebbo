[project]
name = "pebbo"
version = "0.1.0"
description = "Core service of Pebbo, a local-first desk AI assistant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=19.0.2",
    "fastapi>=0.162.5",
    "mcp>=2.3.0",
    "pipecat-ai[local-smart-turn,openai,pocket-tts,silero,webrtc,websocket,whisper]>=1.16.0",
    "sherpa-onnx>=2.0.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12==12.9.2.10 ; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12==9.28.1.4 ; sys_platform != 'darwin'",
]

[project.scripts]
pebbo = "pebbo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pebbo"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# German text legitimately uses typographic dashes and quotes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests may only reach loopback. Any other connection fails (see docs/development.md).
addopts = "--allow-hosts=127.0.0.1,::1"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.4",
]

[tool.uv]
# Supply-chain safety: only resolve versions that have been public for at least 7 days.
exclude-newer = "7 days"
# Pebbo runs on Windows and Linux PCs. Refuse versions without wheels for either, so an update that
# only ships Linux wheels (as nvidia-cublas-cu12 12.9.3.13 did) fails to lock instead of breaking setup.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.mypy.overrides]]
# Speech libraries without type information.
module = ["ctranslate2", "ctranslate2.*", "onnxruntime", "onnxruntime.*", "faster_whisper", "faster_whisper.*", "pocket_tts", "pocket_tts.*", "sherpa_onnx", "sherpa_onnx.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pipecat's event handler decorators and some strategy methods are untyped.
module = ["pebbo.voice.*", "pebbo.devices.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
